services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: fraudcapstone
      MYSQL_USER: fraud
      MYSQL_PASSWORD: fraud
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - mysql-data:/var/lib/mysql

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/fraudcapstone?useSSL=false&allowPublicKeyRetrieval=true
      DB_USER: fraud
      DB_PASSWORD: fraud
      PROCESSOR_MODE: ${PROCESSOR_MODE:-rules}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5}
    ports:
      - "8080:8080"

volumes:
  mysql-data:
