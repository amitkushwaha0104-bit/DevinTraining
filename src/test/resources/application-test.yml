spring:
  datasource:
    url: jdbc:h2:mem:fraudtest;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  ai:
    anthropic:
      api-key: test-placeholder-key
      chat:
        options:
          model: claude-sonnet-4-5
          temperature: 0.0

capstone:
  processor-mode: rules
  human-review-required: true
  allow-financial-actions: false
  allow-customer-contact: false
  retrieval:
    top-k: 4
    similarity-threshold: 0.10
  memory:
    max-messages: 12
  tools:
    timeout-ms: 2500
    deterministic-seed: fraud-training-v1
