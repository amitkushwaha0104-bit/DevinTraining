<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('New fraud case')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<div th:replace="~{fragments :: alerts}"></div>
<main class="container py-4" style="max-width: 860px;">
    <h1 class="h3">Fraud case intake</h1>
    <p class="text-muted small">Masked references only - raw card or account numbers are rejected. All data must be synthetic.</p>
    <form th:action="@{/cases}" th:object="${form}" method="post" class="card card-body shadow-sm">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label" for="maskedCustomerRef">Masked customer reference</label>
                <input class="form-control" id="maskedCustomerRef" th:field="*{maskedCustomerRef}"
                       placeholder="CUST-••••-4821" required>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="homeRegion">Home region</label>
                <input class="form-control" id="homeRegion" th:field="*{homeRegion}" placeholder="IN-MH">
            </div>
            <div class="col-md-6">
                <label class="form-label" for="transactionRef">Transaction reference</label>
                <input class="form-control" id="transactionRef" th:field="*{transactionRef}"
                       placeholder="TXN-2026-784102" required>
            </div>
            <div class="col-md-3">
                <label class="form-label" for="amount">Amount</label>
                <input class="form-control" id="amount" th:field="*{amount}" type="number" step="0.01" min="0.01" required>
            </div>
            <div class="col-md-3">
                <label class="form-label" for="currency">Currency</label>
                <input class="form-control" id="currency" th:field="*{currency}" maxlength="3" required>
            </div>
            <div class="col-md-4">
                <label class="form-label" for="occurredAt">Occurred at</label>
                <input class="form-control" id="occurredAt" th:field="*{occurredAt}" type="datetime-local">
            </div>
            <div class="col-md-4">
                <label class="form-label" for="status">Transaction status</label>
                <select class="form-select" id="status" th:field="*{status}">
                    <option value="POSTED">POSTED</option><option value="PENDING">PENDING</option>
                    <option value="SETTLED">SETTLED</option><option value="DECLINED">DECLINED</option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label" for="channel">Transaction channel</label>
                <select class="form-select" id="channel" th:field="*{channel}">
                    <option value="CARD_NOT_PRESENT">Card not present</option>
                    <option value="CARD_PRESENT">Card present</option>
                    <option value="ATM">ATM</option><option value="BANK_TRANSFER">Bank transfer</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="maskedMerchant">Masked merchant</label>
                <input class="form-control" id="maskedMerchant" th:field="*{maskedMerchant}"
                       placeholder="NORTHSTAR DIGITAL ••••73" required>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="issueType">Issue type</label>
                <select class="form-select" id="issueType" th:field="*{issueType}">
                    <option value="MERCHANT_NOT_RECOGNISED">Merchant not recognised</option>
                    <option value="FULFILMENT_PROBLEM">Fulfilment problem</option>
                    <option value="CANCELLATION_PROBLEM">Cancellation problem</option>
                    <option value="AMOUNT_DISPUTE">Amount dispute</option>
                    <option value="DUPLICATE_CHARGE">Duplicate charge</option>
                    <option value="OTHER">Other</option>
                </select>
            </div>
            <div class="col-12">
                <label class="form-label" for="customerStatement">Customer statement</label>
                <textarea class="form-control" id="customerStatement" th:field="*{customerStatement}" rows="3"
                          maxlength="4000" required></textarea>
                <div class="form-text">Plain text only. Markup and scripts are rejected.</div>
            </div>
            <div class="col-md-4 form-check ms-2">
                <input class="form-check-input" type="checkbox" id="cardPossession" th:field="*{cardPossession}">
                <label class="form-check-label" for="cardPossession">Customer still has the card</label>
            </div>
            <div class="col-md-4 form-check">
                <input class="form-check-input" type="checkbox" id="merchantRecognised" th:field="*{merchantRecognised}">
                <label class="form-check-label" for="merchantRecognised">Customer recognises merchant</label>
            </div>
            <div class="col-md-6 form-check ms-2">
                <input class="form-check-input" type="checkbox" id="syntheticDataConfirmed" th:field="*{syntheticDataConfirmed}" required>
                <label class="form-check-label" for="syntheticDataConfirmed">All data is synthetic</label>
            </div>
            <div class="col-md-5 form-check">
                <input class="form-check-input" type="checkbox" id="reviewRequired" th:field="*{reviewRequired}" required>
                <label class="form-check-label" for="reviewRequired">Human review will be required</label>
            </div>
        </div>
        <div class="mt-4">
            <button class="btn btn-primary" type="submit">Create case</button>
            <a class="btn btn-outline-secondary" th:href="@{/cases}">Cancel</a>
        </div>
    </form>
</main>
</body>
</html>
