<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark" th:fragment="nav">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/cases}">Fraud Case Assistant <span class="badge bg-warning text-dark">SYNTHETIC</span></a>
        <div class="d-flex align-items-center gap-2" sec:authorize="isAuthenticated()">
            <a class="btn btn-outline-light btn-sm" th:href="@{/cases}">Cases</a>
            <a class="btn btn-outline-light btn-sm" th:href="@{/cases/new}"
               sec:authorize="hasAnyRole('AGENT','INVESTIGATOR')">New case</a>
            <span class="text-light small" sec:authentication="name"></span>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button class="btn btn-outline-danger btn-sm" type="submit">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container-fluid" th:fragment="alerts">
    <div class="alert alert-success mt-3" role="status" th:if="${message}" th:text="${message}"></div>
    <div class="alert alert-danger mt-3" role="alert" th:if="${error}" th:text="${error}"></div>
</div>

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Fraud Case Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
</body>
</html>
