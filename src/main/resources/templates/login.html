<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Sign in')}"></head>
<body class="bg-light">
<div class="container" style="max-width: 420px; margin-top: 8vh;">
    <div class="card shadow-sm">
        <div class="card-body">
            <h1 class="h4 mb-3">Fraud Case Assistant</h1>
            <p class="text-muted small">Synthetic training environment. All data is fake.</p>
            <div class="alert alert-danger" role="alert" th:if="${param.error}">Invalid credentials.</div>
            <div class="alert alert-info" role="status" th:if="${param.logout}">Signed out.</div>
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label" for="username">Username</label>
                    <input class="form-control" id="username" name="username" autofocus required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Password</label>
                    <input class="form-control" id="password" name="password" type="password" required>
                </div>
                <button class="btn btn-primary w-100" type="submit">Sign in</button>
            </form>
            <p class="text-muted small mt-3 mb-0">Demo users: agent, investigator, reviewer, auditor, lead</p>
        </div>
    </div>
</div>
</body>
</html>
