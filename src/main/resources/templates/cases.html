<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Cases')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<div th:replace="~{fragments :: alerts}"></div>
<main class="container-fluid py-4">
    <h1 class="h3">Fraud cases</h1>
    <p class="text-muted" th:if="${#lists.isEmpty(cases)}">No cases yet. Create one from the intake screen.</p>
    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead>
            <tr>
                <th scope="col">Case</th><th scope="col">Customer ref</th><th scope="col">Status</th>
                <th scope="col">Analyst</th><th scope="col">Reported</th><th scope="col"></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${cases}">
                <td><a th:href="@{/cases/{id}(id=${c.caseId})}" th:text="${c.caseId}"></a></td>
                <td th:text="${c.maskedCustomerRef}"></td>
                <td><span class="badge" th:classappend="${c.status.name() == 'READY_FOR_REVIEW'} ? 'bg-primary' : (${c.status.name() == 'CLOSED' or c.status.name() == 'ROUTED'} ? 'bg-success' : 'bg-secondary')" th:text="${c.status}"></span></td>
                <td th:text="${c.analystId}"></td>
                <td th:text="${#temporals.format(c.reportedAt, 'yyyy-MM-dd HH:mm')}"></td>
                <td class="text-end">
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/cases/{id}/evidence(id=${c.caseId})}">Evidence</a>
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/cases/{id}/citations(id=${c.caseId})}">Citations</a>
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/cases/{id}/review(id=${c.caseId})}"
                       sec:authorize="hasRole('REVIEWER')">Review</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
